<body>
<h2>Business Day Aging Calculator</h2>
<label for="schedule">Select Schedule:</label><br>
<select id="schedule">
  <option value="monfri">Mon-Fri</option>
  <option value="tuesat">Tue-Sat</option>
  <option value="monsat">Mon-Sat</option>
</select>
<br>
<button onclick="calculateAging()">Generate</button>
<button onclick="window.print()">Print</button>
<div id="output"></div>
<div id="printWorksheet"></div>
<script>
function isBusinessDay(date, schedule) {
  const day = date.getDay();

  if (schedule === "monfri") {
    return day !== 0 && day !== 6;
  }

  if (schedule === "tuesat") {
    return day !== 0 && day !== 1;
  }

  if (schedule === "monsat") {
    return day !== 0;
  }

  return false;
}
function formatDate(date) {
  return `${date.getMonth() + 1}/${date.getDate()}`;
}
function getPreviousBusinessDays(startDate, count, schedule) {
  const days = [];
  const current = new Date(startDate);
  current.setHours(12, 0, 0, 0);
  while (days.length < count) {
    if (isBusinessDay(current, schedule)) {
      days.push(new Date(current));
    }
    current.setDate(current.getDate() - 1);
  }
  return days;
}
function getAgingData() {
  const schedule = document.getElementById("schedule").value;
  const today = new Date();
  today.setHours(12, 0, 0, 0);

  const days = getPreviousBusinessDays(today, 61, schedule);

  return {
    today: formatDate(today),

    scheduleLabel:
      schedule === "monfri"
        ? "Mon-Fri"
        : schedule === "tuesat"
        ? "Tue-Sat"
        : "Mon-Sat",

    range01: `${formatDate(days[1])} to ${formatDate(days[0])}`,
    range25: `${formatDate(days[5])} to ${formatDate(days[2])}`,
    range610: `${formatDate(days[10])} to ${formatDate(days[6])}`,

    range1115: `${formatDate(days[15])} to ${formatDate(days[11])}`,
    range1620: `${formatDate(days[20])} to ${formatDate(days[16])}`,
    range2125: `${formatDate(days[25])} to ${formatDate(days[21])}`,
    range2630: `${formatDate(days[30])} to ${formatDate(days[26])}`,
    range3135: `${formatDate(days[35])} to ${formatDate(days[31])}`,
    range3640: `${formatDate(days[40])} to ${formatDate(days[36])}`,
    range4145: `${formatDate(days[45])} to ${formatDate(days[41])}`,
    range4650: `${formatDate(days[50])} to ${formatDate(days[46])}`,
    range5155: `${formatDate(days[55])} to ${formatDate(days[51])}`,
    range5660: `${formatDate(days[60])} to ${formatDate(days[56])}`,

    over60: `Before ${formatDate(days[60])}`
  };
}
document.getElementById("output").innerHTML = `
  <div><span class="label">Today:</span> ${data.today}</div>
  <div><span class="label">Schedule:</span> ${data.scheduleLabel}</div>

  <div><span class="label">0-1 days old:</span> ${data.range01}</div>
  <div><span class="label">2-5 days old:</span> ${data.range25}</div>
  <div><span class="label">6-10 days old:</span> ${data.range610}</div>

  <div><span class="label">11-15 days old:</span> ${data.range1115}</div>
  <div><span class="label">16-20 days old:</span> ${data.range1620}</div>
  <div><span class="label">21-25 days old:</span> ${data.range2125}</div>
  <div><span class="label">26-30 days old:</span> ${data.range2630}</div>
  <div><span class="label">31-35 days old:</span> ${data.range3135}</div>
  <div><span class="label">36-40 days old:</span> ${data.range3640}</div>
  <div><span class="label">41-45 days old:</span> ${data.range4145}</div>
  <div><span class="label">46-50 days old:</span> ${data.range4650}</div>
  <div><span class="label">51-55 days old:</span> ${data.range5155}</div>
  <div><span class="label">56-60 days old:</span> ${data.range5660}</div>

  <div><span class="label">More than 60 days old:</span> ${data.over60}</div>
`;
